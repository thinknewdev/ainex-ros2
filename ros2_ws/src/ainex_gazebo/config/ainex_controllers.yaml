# ros2_control controllers for the AiNex Gazebo Classic simulation.
#
# joint_group_position_controller subscribes to
#   /joint_group_position_controller/commands  (std_msgs/Float64MultiArray)
# The data array MUST contain 24 radians in EXACTLY this order (do not reorder;
# an external adapter publishes in this order — see README joint table):
#   0  r_hip_yaw     6  l_hip_yaw    12 r_sho_pitch  18 l_el_yaw
#   1  r_hip_roll    7  l_hip_roll   13 l_sho_pitch  19 r_el_yaw
#   2  r_hip_pitch   8  l_hip_pitch  14 l_sho_roll   20 l_gripper
#   3  r_knee        9  l_knee       15 r_sho_roll   21 r_gripper
#   4  r_ank_pitch  10  l_ank_pitch  16 l_el_pitch   22 head_pan
#   5  r_ank_roll   11  l_ank_roll   17 r_el_pitch   23 head_tilt
# (indices 0-13 match the walking module joint_index in ainex_controller.py;
#  14-23 follow the vendor servo-ID order 15..24)

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

joint_group_position_controller:
  ros__parameters:
    joints:
      - r_hip_yaw
      - r_hip_roll
      - r_hip_pitch
      - r_knee
      - r_ank_pitch
      - r_ank_roll
      - l_hip_yaw
      - l_hip_roll
      - l_hip_pitch
      - l_knee
      - l_ank_pitch
      - l_ank_roll
      - r_sho_pitch
      - l_sho_pitch
      - l_sho_roll
      - r_sho_roll
      - l_el_pitch
      - r_el_pitch
      - l_el_yaw
      - r_el_yaw
      - l_gripper
      - r_gripper
      - head_pan
      - head_tilt

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
